name: Lint SKILL.md

on:
  push:
    branches: [main]
    paths:
      - "skills/**/SKILL.md"
  pull_request:
    paths:
      - "skills/**/SKILL.md"
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Lint SKILL.md frontmatter
        uses: effectorHQ/skill-lint-action@v1
        with:
          path: "skills"