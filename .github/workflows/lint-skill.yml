name: Lint SKILL.md

on:
  push:
    branches: [main]
    paths:
      - "skills/**/SKILL.md"
      - "scripts/validate_skill_frontmatter.py"
      - ".github/workflows/lint-skill.yml"
  pull_request:
    paths:
      - "skills/**/SKILL.md"
      - "scripts/validate_skill_frontmatter.py"
      - ".github/workflows/lint-skill.yml"
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Validate SKILL.md frontmatter (stdlib YAML subset)
        run: python3 scripts/validate_skill_frontmatter.py skills
